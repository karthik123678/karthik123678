<svg width="620" height="560" viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="620" height="560" fill="none"/>
  <line x1="60" y1="20" x2="60" y2="540" stroke="url(#lineGrad)" stroke-width="2.5" stroke-opacity="0.55"/>

  <g font-family="Segoe UI, Helvetica, sans-serif" filter="url(#cardShadow2)">
    <!-- 9 stages -->
    <g transform="translate(0,20)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#6366F1" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#C7D2FE" font-weight="600">Programming</text>
    </g>
    <g transform="translate(0,80)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#6D6BF3" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#6D6BF3" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#C7D2FE" font-weight="600">Web Development</text>
    </g>
    <g transform="translate(0,140)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#7C3AED" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#7C3AED" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#DDD6FE" font-weight="600">MERN</text>
    </g>
    <g transform="translate(0,200)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#8455E8" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#8455E8" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#DDD6FE" font-weight="600">Full Stack Projects</text>
    </g>
    <g transform="translate(0,260)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#8B5CF6" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#DDD6FE" font-weight="600">Cloud</text>
    </g>
    <g transform="translate(0,320)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#6D8FEA" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#6D8FEA" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#BFDBFE" font-weight="600">AI / ML</text>
    </g>
    <g transform="translate(0,380)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#4FA9E0" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#4FA9E0" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#A5F3FC" font-weight="600">Generative AI</text>
    </g>
    <g transform="translate(0,440)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#2FC3DB" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#2FC3DB" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#A5F3FC" font-weight="600">LLM Applications</text>
    </g>
    <g transform="translate(0,500)">
      <circle cx="60" cy="0" r="7" fill="#0B0B0F" stroke="#22D3EE" stroke-width="3" filter="url(#nodeGlow)"/>
      <rect x="90" y="-18" width="280" height="36" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="106" y="5" font-size="13.5" fill="#67E8F9" font-weight="700">AI Engineering</text>
    </g>
  </g>
</svg>
