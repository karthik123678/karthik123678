<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="pipeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow3" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bg3)"/>
  <line x1="55" y1="110" x2="845" y2="110" stroke="url(#pipeEdge)" stroke-width="2" stroke-opacity="0.5"/>

  <g font-family="Segoe UI, Helvetica, sans-serif" filter="url(#shadow3)">
    <!-- Data -->
    <g transform="translate(30,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#22D3EE" stroke-opacity="0.6"/>
      <path d="M25 30 a20 8 0 0 1 40 0 v20 a20 8 0 0 1 -40 0z" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
      <text x="45" y="103" text-anchor="middle" font-size="12" fill="#A5F3FC" font-weight="600">Data</text>
    </g>

    <!-- Processing -->
    <g transform="translate(190,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#06B6D4" stroke-opacity="0.6"/>
      <circle cx="45" cy="45" r="14" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
      <line x1="45" y1="24" x2="45" y2="31" stroke="#67E8F9" stroke-width="1.8"/>
      <line x1="45" y1="59" x2="45" y2="66" stroke="#67E8F9" stroke-width="1.8"/>
      <line x1="24" y1="45" x2="31" y2="45" stroke="#67E8F9" stroke-width="1.8"/>
      <line x1="59" y1="45" x2="66" y2="45" stroke="#67E8F9" stroke-width="1.8"/>
      <text x="45" y="103" text-anchor="middle" font-size="12" fill="#A5F3FC" font-weight="600">Processing</text>
    </g>

    <!-- Model -->
    <g transform="translate(350,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#7C3AED" stroke-opacity="0.6"/>
      <circle cx="45" cy="30" r="3" fill="#C4B5FD"/>
      <circle cx="32" cy="50" r="3" fill="#C4B5FD"/>
      <circle cx="58" cy="50" r="3" fill="#C4B5FD"/>
      <circle cx="45" cy="60" r="3" fill="#C4B5FD"/>
      <line x1="45" y1="30" x2="32" y2="50" stroke="#C4B5FD" stroke-width="1.2"/>
      <line x1="45" y1="30" x2="58" y2="50" stroke="#C4B5FD" stroke-width="1.2"/>
      <line x1="32" y1="50" x2="45" y2="60" stroke="#C4B5FD" stroke-width="1.2"/>
      <line x1="58" y1="50" x2="45" y2="60" stroke="#C4B5FD" stroke-width="1.2"/>
      <text x="45" y="103" text-anchor="middle" font-size="12" fill="#DDD6FE" font-weight="600">Model</text>
    </g>

    <!-- LLM / AI -->
    <g transform="translate(510,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <rect x="25" y="30" width="40" height="28" rx="6" fill="none" stroke="#C4B5FD" stroke-width="1.8"/>
      <line x1="32" y1="40" x2="58" y2="40" stroke="#C4B5FD" stroke-width="1.4"/>
      <line x1="32" y1="48" x2="50" y2="48" stroke="#C4B5FD" stroke-width="1.4"/>
      <text x="45" y="103" text-anchor="middle" font-size="12" fill="#DDD6FE" font-weight="600">LLM / AI</text>
    </g>

    <!-- Application -->
    <g transform="translate(670,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#6366F1" stroke-opacity="0.6"/>
      <rect x="27" y="26" width="36" height="38" rx="5" fill="none" stroke="#A5B4FC" stroke-width="1.8"/>
      <line x1="27" y1="36" x2="63" y2="36" stroke="#A5B4FC" stroke-width="1.4"/>
      <text x="45" y="103" text-anchor="middle" font-size="11.5" fill="#C7D2FE" font-weight="600">Application</text>
    </g>

    <!-- User -->
    <g transform="translate(800,65)">
      <circle cx="45" cy="45" r="45" fill="url(#nodeFill)" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="45" cy="34" r="10" fill="none" stroke="#A5B4FC" stroke-width="1.8"/>
      <path d="M28 66 Q45 46 62 66" fill="none" stroke="#A5B4FC" stroke-width="1.8"/>
      <text x="45" y="103" text-anchor="middle" font-size="12" fill="#C7D2FE" font-weight="600">User</text>
    </g>
  </g>

  <g fill="#7C3AED" fill-opacity="0.85">
    <path d="M175 110 l-8 -5 v10 z"/>
    <path d="M335 110 l-8 -5 v10 z"/>
    <path d="M495 110 l-8 -5 v10 z"/>
    <path d="M655 110 l-8 -5 v10 z"/>
    <path d="M785 110 l-8 -5 v10 z"/>
  </g>
</svg>
