<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg2)"/>

  <!-- flow arrow line -->
  <line x1="60" y1="130" x2="840" y2="130" stroke="url(#edgeGrad)" stroke-width="2" stroke-opacity="0.55"/>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, sans-serif">
    <!-- User -->
    <g transform="translate(20,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="120" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="120" height="88" rx="14" fill="url(#cardFill)" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="60" cy="30" r="12" fill="none" stroke="#A5B4FC" stroke-width="2"/>
      <path d="M40 66 Q60 44 80 66" fill="none" stroke="#A5B4FC" stroke-width="2"/>
      <text x="60" y="82" text-anchor="middle" font-size="12" fill="#C7D2FE" font-weight="600">User</text>
    </g>

    <!-- React Frontend -->
    <g transform="translate(175,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="140" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="140" height="88" rx="14" fill="url(#cardFill)" stroke="#7C3AED" stroke-opacity="0.6"/>
      <circle cx="70" cy="34" r="6" fill="none" stroke="#C4B5FD" stroke-width="2"/>
      <ellipse cx="70" cy="34" rx="20" ry="8" fill="none" stroke="#C4B5FD" stroke-width="1.4"/>
      <ellipse cx="70" cy="34" rx="20" ry="8" fill="none" stroke="#C4B5FD" stroke-width="1.4" transform="rotate(60 70 34)"/>
      <ellipse cx="70" cy="34" rx="20" ry="8" fill="none" stroke="#C4B5FD" stroke-width="1.4" transform="rotate(120 70 34)"/>
      <text x="70" y="76" text-anchor="middle" font-size="11.5" fill="#DDD6FE" font-weight="600">React Frontend</text>
    </g>

    <!-- Node/Express API -->
    <g transform="translate(345,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="150" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="150" height="88" rx="14" fill="url(#cardFill)" stroke="#06B6D4" stroke-opacity="0.6"/>
      <rect x="45" y="22" width="60" height="26" rx="6" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <line x1="55" y1="34" x2="95" y2="34" stroke="#67E8F9" stroke-width="1.4"/>
      <text x="75" y="76" text-anchor="middle" font-size="11.5" fill="#A5F3FC" font-weight="600">Node / Express API</text>
    </g>

    <!-- MongoDB / MySQL -->
    <g transform="translate(525,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="140" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="140" height="88" rx="14" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.6"/>
      <ellipse cx="70" cy="26" rx="22" ry="8" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <path d="M48 26 v18 a22 8 0 0 0 44 0 v-18" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <text x="70" y="76" text-anchor="middle" font-size="11.5" fill="#A5F3FC" font-weight="600">MongoDB / MySQL</text>
    </g>

    <!-- AWS / Cloud -->
    <g transform="translate(695,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="90" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="90" height="88" rx="14" fill="url(#cardFill)" stroke="#8B5CF6" stroke-opacity="0.6"/>
      <path d="M25 34 a12 12 0 0 1 22 -6 a10 10 0 0 1 10 16 h-34 a9 9 0 0 1 2 -10z" fill="none" stroke="#C4B5FD" stroke-width="2"/>
      <text x="45" y="76" text-anchor="middle" font-size="11" fill="#DDD6FE" font-weight="600">Cloud</text>
    </g>

    <!-- AI Services -->
    <g transform="translate(800,80)" filter="url(#shadow2)">
      <rect x="4" y="6" width="90" height="88" rx="14" fill="#000000" fill-opacity="0.4"/>
      <rect width="90" height="88" rx="14" fill="url(#cardFill)" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="45" cy="26" r="3" fill="#A5B4FC"/>
      <circle cx="32" cy="40" r="3" fill="#A5B4FC"/>
      <circle cx="58" cy="40" r="3" fill="#A5B4FC"/>
      <line x1="45" y1="26" x2="32" y2="40" stroke="#A5B4FC" stroke-width="1.2"/>
      <line x1="45" y1="26" x2="58" y2="40" stroke="#A5B4FC" stroke-width="1.2"/>
      <line x1="32" y1="40" x2="58" y2="40" stroke="#A5B4FC" stroke-width="1.2"/>
      <text x="45" y="76" text-anchor="middle" font-size="10.5" fill="#C7D2FE" font-weight="600">AI Services</text>
    </g>
  </g>

  <!-- arrowheads -->
  <g fill="#22D3EE" fill-opacity="0.8">
    <path d="M160 130 l-8 -5 v10 z"/>
    <path d="M330 130 l-8 -5 v10 z"/>
    <path d="M500 130 l-8 -5 v10 z"/>
    <path d="M680 130 l-8 -5 v10 z"/>
    <path d="M785 130 l-8 -5 v10 z"/>
  </g>
</svg>
